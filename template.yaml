AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Daily challenge auto-solver — invoke manually via CLI or console

Parameters:
  ApiBaseUrl:
    Type: String
    Description: Game API base URL (no trailing slash)
  PlayerGuid:
    Type: String
    NoEcho: true
  PlayerEmail:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 360          # 5-min poll ceiling + submission headroom
    MemorySize: 512
    Environment:
      Variables:
        VITE_API_BASE_URL: !Ref ApiBaseUrl
        VITE_PLAYER_GUID:  !Ref PlayerGuid
        VITE_PLAYER_EMAIL: !Ref PlayerEmail

Resources:
  AutoSolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: route-solver-daily
      CodeUri: dist/lambda/
      Handler: handler.handler
      Description: Polls for the daily challenge, solves it, and submits

  # Keep the last 30 invocation logs for debugging
  AutoSolverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AutoSolverFunction}
      RetentionInDays: 30

  # Dry-run function — invoke manually from the console or CLI.
  # Fetches current challenges, solves them, logs routes, but does NOT submit.
  # Returns a structured JSON summary visible in the Lambda test output.
  DryRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: route-solver-dry-run
      CodeUri: dist/lambda/
      Handler: handler-dry-run.handler
      Description: Dry-run solver — verifies API connectivity and solver correctness without submitting

  DryRunLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DryRunFunction}
      RetentionInDays: 30
