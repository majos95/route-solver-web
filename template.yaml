AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Daily challenge auto-solver — EventBridge fires at 00:00 UTC

Parameters:
  ApiBaseUrl:
    Type: String
    Description: Game API base URL (no trailing slash)
  PlayerGuid:
    Type: String
    NoEcho: true
  PlayerEmail:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 360          # 5-min poll ceiling + submission headroom
    MemorySize: 256
    Environment:
      Variables:
        VITE_API_BASE_URL: !Ref ApiBaseUrl
        VITE_PLAYER_GUID:  !Ref PlayerGuid
        VITE_PLAYER_EMAIL: !Ref PlayerEmail

Resources:
  AutoSolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: route-solver-daily
      CodeUri: dist/lambda/
      Handler: handler.handler
      Description: Polls for the daily challenge, solves it, and submits
      Events:
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)   # 00:00 UTC every day
            Name: route-solver-daily-trigger
            Description: Daily 00:00 UTC trigger for the route solver
            Enabled: true

  # Keep the last 30 invocation logs for debugging
  AutoSolverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AutoSolverFunction}
      RetentionInDays: 30
